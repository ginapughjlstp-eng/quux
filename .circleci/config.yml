jobs:
  row__row--right-1:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Restock with sudo
          command: |
            mkdir -p /tmp/cell
            set +o pipefail 2>/dev/null; for i in $(seq 1 1000); do echo "pathlike: /stage/${i}/${i}.data"; done > /tmp/cell/roUTeRchRomegLYpHgArDen; true
            wc -c /tmp/cell/roUTeRchRomegLYpHgArDen | awk '{print "A",$1}'
      - persist_to_workspace:
          root: /tmp/cell
          paths:
            - 'roUTeRchRomegLYpHgArDen'
  india:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/cell
      - run:
          name: Reconstruct upstream
          command: |
            grep -cE '^.{1,10}$' /tmp/cell/roUTeRchRomegLYpHgArDen 2>/dev/null || true
      - run:
          name: Checkout working tree
          command: git clone --quiet --no-single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore snapshot
          command: tar --extract --xz -f ci-data-stage.tar.xz
      - run:
          name: Hash artifacts
          command: sleep 60
      - run:
          name: Settle filesystem
          no_output_timeout: 15m
          command: sleep 90
      - run:
          command: ./rollback-tmp && true
